          runtime = _load_module('runtime', '"""WAFGuard: scheduled log ingestion, policy evaluation and optional enforcement."""\nimport gzip\nimport hashlib\nimport json\nimport os\nimport re\nimport time\nfrom datetime import datetime, timedelta, timezone\n\nimport boto3\nfrom botocore.config import Config as BotoConfig\nfrom botocore.exceptions import BotoCoreError, ClientError\n\nfrom client import ApiError, FraudGuard, TimeBudget, timestamp\nfrom policy import assess, evidence, extract_event, normalize_ip\nfrom state import State\n\n\ndef log(event, **fields):\n    print(json.dumps({\'component\': \'wafguard\', \'event\': event, **fields},\n                     separators=(\',\', \':\'), default=str))\n\n\ndef active(row, now):\n    expiry = row.get(\'expires_at\')\n    return expiry is None or expiry > now\n\n\nclass Settings:\n    def __init__(self, env):\n        self.mode = env.get(\'MODE\', \'Observe\')\n        self.detection_policy = env.get(\'DETECTION_POLICY\', \'WafAndAce\')\n        self.publish = env.get(\'PUBLISH_BLACKLIST\', \'false\').lower() == \'true\'\n        self.sync = env.get(\'SYNC_WAF\', \'false\').lower() == \'true\'\n        self.plan = env.get(\'FG_PLAN\', \'Professional\')\n        self.notification_mode = env.get(\'NOTIFICATION_MODE\', \'None\')\n        self.topic = env.get(\'SNS_TOPIC_ARN\', \'\')\n        self.deployment = env.get(\'DEPLOYMENT_ID\', \'wafguard\')\n        if self.mode not in (\'Observe\', \'Enforce\'):\n            raise ValueError(\'invalid_MODE\')\n        if self.detection_policy not in (\'WafAndAce\', \'WafOnly\'):\n            raise ValueError(\'invalid_DETECTION_POLICY\')\n        if self.plan not in (\'Professional\', \'Business\', \'Enterprise\'):\n            raise ValueError(\'invalid_FG_PLAN\')\n        if self.notification_mode not in (\'None\', \'CreateTopic\', \'ExistingTopic\'):\n            raise ValueError(\'invalid_NOTIFICATION_MODE\')\n        if self.notification_mode != \'None\' and not self.topic:\n            raise ValueError(\'SNS_TOPIC_ARN_required\')\n        self.bucket = env[\'LOG_BUCKET\']\n        self.prefix = env.get(\'LOG_PREFIX\', \'\')\n        if self.prefix.startswith(\'/\') or (self.prefix and not self.prefix.endswith(\'/\')):\n            raise ValueError(\'invalid_LOG_PREFIX\')\n        self.web_acl = env[\'WEB_ACL_ARN\']\n        match = re.fullmatch(r\'arn:(aws|aws-us-gov|aws-cn):wafv2:([^:]+):(\\d{12}):regional/webacl/([^/]+)/([^/]+)\',\n                             self.web_acl)\n        if not match:\n            raise ValueError(\'regional_WEB_ACL_ARN_required\')\n        self.region, self.account, self.acl_name = match.group(2, 3, 4)\n        if env.get(\'AWS_REGION\', self.region) != self.region:\n            raise ValueError(\'web_acl_and_stack_must_share_region\')\n        self.secret_arn, self.table = env[\'FG_SECRET_ARN\'], env[\'TABLE_NAME\']\n        split = lambda key: [part.strip() for part in env.get(key, \'\').split(\',\') if part.strip()]\n        self.rule_ids = split(\'SELECTED_RULE_IDS\')\n        self.labels = split(\'SELECTED_LABELS\')\n        self.own_rules = split(\'OWN_RULE_IDS\')\n        if not self.rule_ids and not self.labels:\n            raise ValueError(\'select_at_least_one_security_rule_or_label\')\n        self.minimum = self.number(env, \'MIN_SECURITY_MATCHES\', 3, 1, 1000)\n        self.window = self.number(env, \'EVIDENCE_WINDOW_SECONDS\', 300, 60, 3600)\n        self.max_age = self.number(env, \'MAX_EVENT_AGE_SECONDS\', 900, 300, 3600)\n        self.cache_override = self.number(env, \'CACHE_TTL_OVERRIDE\', 0, 0, 31536000)\n        self.blacklist_override = self.number(env, \'BLACKLIST_TTL_OVERRIDE\', 0, 0, 31536000)\n        if 0 < self.blacklist_override < 60:\n            raise ValueError(\'BLACKLIST_TTL_OVERRIDE_requires_zero_or_at_least_60\')\n        if self.detection_policy == \'WafOnly\' and self.blacklist_override == 0:\n            raise ValueError(\'WafOnly_requires_explicit_BLACKLIST_TTL_OVERRIDE_at_least_60\')\n        # One fixed ceiling across list reads, ACE lookups and blacklist writes.\n        # Ignore the former environment override, including on stack upgrades.\n        self.rate = 3 if self.plan == \'Professional\' else 1\n        self.daily_budget = self.number(env, \'DAILY_LOOKUP_BUDGET\', 10000, 1, 5000000)\n        self.max_bytes = self.number(env, \'MAX_OBJECT_BYTES\', 33554432, 1024, 268435456)\n        self.max_objects = self.number(env, \'MAX_OBJECTS_PER_RUN\', 100, 1, 1000)\n        self.ip_sets = []\n        if self.sync:\n            for family in (\'IPV4\', \'IPV6\'):\n                ident, name = env.get(\'WAF_\' + family + \'_ID\'), env.get(\'WAF_\' + family + \'_NAME\')\n                if not ident or not name:\n                    raise ValueError(\'dedicated_WAF_IP_sets_required\')\n                self.ip_sets.append({\'version\': family, \'Id\': ident, \'Name\': name})\n\n    @staticmethod\n    def number(env, name, default, minimum, maximum):\n        value = int(env.get(name, default))\n        if not minimum <= value <= maximum:\n            raise ValueError(\'invalid_\' + name)\n        return value\n\n\ndef minute_prefixes(settings, now):\n    start = datetime.fromtimestamp(now - settings.max_age - 300, timezone.utc).replace(second=0, microsecond=0)\n    end = datetime.fromtimestamp(now, timezone.utc).replace(second=0, microsecond=0)\n    while start <= end:\n        yield (settings.prefix + \'AWSLogs/\' + settings.account + \'/WAFLogs/\' + settings.region +\n               \'/\' + settings.acl_name + \'/\' + start.strftime(\'%Y/%m/%d/%H/%M/\'))\n        start += timedelta(minutes=1)\n\n\ndef read_records(body, compressed, maximum):\n    stream = gzip.GzipFile(fileobj=body) if compressed else body\n    total = 0\n    try:\n        while True:\n            line = stream.readline(min(maximum - total + 1, 1024 * 1024 + 1))\n            if not line:\n                return\n            total += len(line)\n            if total > maximum or len(line) > 1024 * 1024:\n                raise ValueError(\'object_or_record_size_limit\')\n            try:\n                record = json.loads(line)\n            except (ValueError, UnicodeError):\n                log(\'invalid_log_record\')\n                continue\n            if isinstance(record, dict):\n                yield record\n    finally:\n        stream.close()\n        body.close()\n\n\ndef ingest(settings, state, s3, api, now):\n    processed = events = duplicates = 0\n    for prefix in minute_prefixes(settings, now):\n        request = {\'Bucket\': settings.bucket, \'Prefix\': prefix, \'MaxKeys\': 1000}\n        while True:\n            api.check_time(75)\n            page = s3.list_objects_v2(**request)\n            for obj in page.get(\'Contents\', []):\n                key = obj[\'Key\']\n                if not key.endswith(\'.log.gz\'):\n                    continue\n                ident, done = state.object_done(settings.bucket, key, obj.get(\'ETag\', \'\'))\n                if done:\n                    continue\n                if processed >= settings.max_objects:\n                    log(\'ingestion_limit\', processed_objects=processed, new_events=events)\n                    return\n                api.check_time(75)\n                if obj.get(\'Size\', 0) > settings.max_bytes:\n                    state.finish_object(ident, \'size_limit\')\n                    log(\'object_rejected\', object_id=ident, reason=\'compressed_size_limit\')\n                    processed += 1\n                    continue\n                response = s3.get_object(Bucket=settings.bucket, Key=key,\n                                         IfMatch=obj[\'ETag\'])\n                try:\n                    for record in read_records(response[\'Body\'], True, settings.max_bytes):\n                        api.check_time(60)\n                        event = extract_event(\n                            record, web_acl_arn=settings.web_acl,\n                            selected_rule_ids=settings.rule_ids, selected_labels=settings.labels,\n                            own_rule_ids=settings.own_rules, now=now,\n                            max_event_age_seconds=settings.max_age)\n                        if event:\n                            if state.add_event(event):\n                                events += 1\n                            else:\n                                duplicates += 1\n                except (ValueError, EOFError, gzip.BadGzipFile):\n                    log(\'object_rejected\', object_id=ident, reason=\'invalid_or_oversized_log\')\n                    state.finish_object(ident, \'invalid_or_oversized\')\n                else:\n                    state.finish_object(ident)\n                processed += 1\n            if not page.get(\'IsTruncated\'):\n                break\n            token = page.get(\'NextContinuationToken\')\n            if not token:\n                raise ValueError(\'invalid_s3_pagination\')\n            request[\'ContinuationToken\'] = token\n    log(\'ingestion_summary\', processed_objects=processed, new_events=events, duplicate_events=duplicates)\n\n\ndef overlay_policy(verdict, ip, snapshot, now):\n    result = dict(verdict)\n    flags = dict(verdict.get(\'customer\') or {})\n    flags[\'ip_in_whitelist\'] = ip in snapshot[\'whitelist\'] and active(snapshot[\'whitelist\'][ip], now)\n    flags[\'ip_in_blacklist\'] = ip in snapshot[\'blacklist\'] and active(snapshot[\'blacklist\'][ip], now)\n    result[\'customer\'] = flags\n    return result\n\n\ndef report_evidence(detail):\n    # Keep decision logs compact; request headers and full URLs never enter this\n    # structure. Full selected evidence is retained in the installation\'s state.\n    result = {key: value for key, value in detail.items() if key != \'details\'}\n    for key in (\'event_ids\', \'rule_ids\', \'labels\', \'path_categories\'):\n        if isinstance(result.get(key), list):\n            result[key] = result[key][:20]\n    return result\n\n\ndef short_snapshot(snapshot):\n    return {\'saved_at\': snapshot[\'saved_at\'], **{\n        name: {ip: {\'expires_at\': row[\'expires_at\']} for ip, row in snapshot[name].items()}\n        for name in (\'blacklist\', \'whitelist\')}}\n\n\ndef enqueue_notification(settings, state, decision):\n    if settings.notification_mode == \'None\' or decision.get(\'notification_created\'):\n        return\n    state.notify({\'event_id\': decision[\'id\'], \'event\': \'blacklist_added\', \'ip\': decision[\'ip\'],\n                  \'expires_at\': decision[\'expires_at\'], \'reason\': decision[\'reason\'],\n                  \'detection_policy\': decision.get(\'detection_policy\', \'WafAndAce\'),\n                  \'deployment_id\': settings.deployment})\n    decision[\'notification_created\'] = True\n    state.save_decision(decision[\'ip\'], decision)\n\n\ndef decision_deadline(decision):\n    return decision.get(\'decision_deadline\') or decision.get(\'expires_at\') or 0\n\n\ndef refresh_policy(state, api, snapshot):\n    # Replace the in-memory view only after a complete successful policy read.\n    fresh = api.policy()\n    state.save_snapshot(short_snapshot(fresh))\n    snapshot.clear()\n    snapshot.update(fresh)\n\n\ndef resolve_write(settings, state, ip, decision, snapshot, now):\n    """Resolve a possibly sent POST from canonical lists; never resubmit it.\n\n    The published POST is an upsert, with counters but no idempotency contract.\n    A matching decision tag proves the write is present. Only an inserted=1\n    acknowledgment also establishes that it created a new entry for SNS.\n    """\n    white = snapshot[\'whitelist\'].get(ip)\n    row = snapshot[\'blacklist\'].get(ip)\n    if white and active(white, now):\n        decision[\'status\'] = \'skipped_whitelisted\'\n        state.save_decision(ip, decision)\n        log(\'blacklist_skipped\', ip=ip, decision_id=decision[\'id\'], reason=\'whitelisted\')\n        state.finish(ip)\n        return\n    if row and active(row, now):\n        tags = row.get(\'tags\', [])\n        owned = \'source:wafguard\' in tags and \'decision:\' + decision[\'id\'] in tags\n        counters = decision.get(\'write_result\') or {}\n        if counters.get(\'updated\') == 1:\n            decision[\'status\'] = \'conflict\'\n            event, reason = \'blacklist_conflict\', \'concurrent_entry_updated\'\n        elif owned:\n            known_insert = counters.get(\'inserted\') == 1 or decision.get(\'status\') == \'confirmed\'\n            decision[\'status\'] = \'confirmed\' if known_insert else \'confirmed_unknown\'\n            event = \'blacklist_added\' if known_insert else \'blacklist_confirmed\'\n            reason = \'inserted\' if known_insert else \'write_found_outcome_unknown\'\n        else:\n            decision[\'status\'] = \'skipped_existing\'\n            event, reason = \'blacklist_skipped\', \'existing_entry_changed_or_owned_elsewhere\'\n        # Use the server\'s actual expiry, including a subsequent customer edit\n        # to permanent. The original attempt deadline remains separate.\n        decision.setdefault(\'decision_deadline\', decision_deadline(decision))\n        decision[\'expires_at\'] = row[\'expires_at\']\n        emit = not decision.get(\'confirmation_logged\')\n        decision[\'confirmation_logged\'] = True\n        state.save_decision(ip, decision)\n        if emit:\n            log(event, ip=ip, decision_id=decision[\'id\'], reason=reason,\n                expires_at=decision[\'expires_at\'],\n                detection_policy=decision.get(\'detection_policy\', \'WafAndAce\'),\n                deployment_id=settings.deployment)\n        if decision[\'status\'] == \'confirmed\' and settings.mode == \'Enforce\':\n            enqueue_notification(settings, state, decision)\n        state.finish(ip)\n        return\n    if now >= decision_deadline(decision):\n        decision[\'status\'] = \'unconfirmed_expired\'\n        # Evidence arriving during an unresolved attempt cannot renew that\n        # attempt after its deadline. A later decision needs later evidence.\n        decision[\'evidence_cutoff\'] = max(decision.get(\'evidence_cutoff\', 0), decision_deadline(decision))\n        state.save_decision(ip, decision)\n        log(\'blacklist_unconfirmed\', ip=ip, decision_id=decision[\'id\'], reason=\'readback_deadline_expired\')\n        state.finish(ip)\n        return\n    log(\'blacklist_readback_pending\', ip=ip, decision_id=decision[\'id\'],\n        reason=\'post_not_retried\')\n    state.defer(ip)\n\n\ndef recover_existing(settings, state, ip, snapshot, now):\n    previous = state.decision(ip)\n    if previous and previous.get(\'status\') in (\'intent\', \'uncertain\', \'confirmed\', \'confirmed_unknown\'):\n        resolve_write(settings, state, ip, previous, snapshot, now)\n    else:\n        state.finish(ip)\n\n\ndef write_decision(settings, state, api, snapshot, ip, result, events, now, *, ace_valid_until=None):\n    latest = max((event[\'timestamp\'] for event in events if event.get(\'selected_match\')), default=0)\n    previous = state.decision(ip)\n    if previous and previous.get(\'status\') in (\'intent\', \'uncertain\'):\n        # Includes legacy records written by the old API-extension client.\n        # Their transport outcome is unknown, so upgrade through reads only.\n        refresh_policy(state, api, snapshot)\n        resolve_write(settings, state, ip, previous, snapshot, api.clock())\n        return\n    if previous and previous.get(\'status\') != \'prepared\':\n        cutoff = max(previous.get(\'evidence_cutoff\', 0), decision_deadline(previous))\n        if latest <= cutoff:\n            state.finish(ip)\n            log(\'blacklist_skipped\', ip=ip, decision_id=previous.get(\'id\'),\n                reason=\'evidence_already_considered\', evidence_cutoff=cutoff)\n            return\n    event_anchor = max((event[\'timestamp\'] for event in events), default=0)\n    selected_times = sorted((event[\'timestamp\'] for event in\n                             evidence(events, now=event_anchor,\n                                      window_seconds=settings.window)[\'details\']\n                             if event[\'selected_match\']), reverse=True)\n\n    def check_admission():\n        current = api.clock()\n        # The threshold must still be backed by fresh requests, not just its\n        # newest member. Preflight list reads and DynamoDB retries can be slow.\n        if (len(selected_times) < settings.minimum\n                or current > selected_times[settings.minimum - 1] + settings.max_age):\n            raise ApiError(\'stale_evidence\')\n        if settings.detection_policy == \'WafAndAce\' and (\n                ace_valid_until is None or current >= ace_valid_until):\n            raise ApiError(\'expired_ace_cache\')\n\n    check_admission()\n    api.check_time(35)\n    refresh_policy(state, api, snapshot)\n    current = api.clock()\n    check_admission()\n    white = snapshot[\'whitelist\'].get(ip)\n    if white and active(white, current):\n        state.finish(ip)\n        log(\'decision_skipped\', ip=ip, reason=\'whitelisted_before_write\')\n        return\n    listed = snapshot[\'blacklist\'].get(ip)\n    if listed and active(listed, current):\n        recover_existing(settings, state, ip, snapshot, current)\n        log(\'decision_skipped\', ip=ip, reason=\'already_blacklisted_before_write\')\n        return\n    if previous and previous.get(\'status\') == \'prepared\':\n        decision = previous\n    else:\n        ident = hashlib.sha256((settings.deployment + \'|\' + ip + \'|\' +\n                                \'|\'.join(sorted(event[\'event_id\'] for event in events))).encode()).hexdigest()[:24]\n        decision = {\'id\': ident, \'ip\': ip, \'status\': \'prepared\',\n                    \'expires_at\': int(now + result[\'ttl_seconds\']),\n                    \'decision_deadline\': int(now + result[\'ttl_seconds\']),\n                    \'evidence_cutoff\': latest, \'reason\': result[\'reason\'],\n                    \'detection_policy\': settings.detection_policy,\n                    \'deployment_id\': settings.deployment}\n        state.save_decision(ip, decision)\n    deployment_tag = (re.sub(r\'[^A-Za-z0-9-]\', \'-\', settings.deployment)[:40] + \'-\' +\n                      hashlib.sha256(settings.deployment.encode()).hexdigest()[:12])\n    tags = [\'source:wafguard\', \'deployment:\' + deployment_tag,\n            \'decision:\' + decision[\'id\']]\n    # Preserve the original policy/label if preflight deferred an unsent write.\n    decision_policy = decision.get(\'detection_policy\', \'WafAndAce\')\n    label = (\'WAFGuard: selected WAF security matches\' if decision_policy == \'WafOnly\'\n             else \'WAFGuard: WAF evidence + ACE block\')\n    def mark_attempt():\n        check_admission()\n        # This must succeed immediately before the network call. A crash from\n        # this point onwards leads only to readback, even if no POST arrived.\n        decision[\'status\'] = \'uncertain\'\n        decision[\'post_attempted_at\'] = int(api.clock())\n        state.save_decision(ip, decision)\n        # If persistence consumed the remaining admission lifetime, do not\n        # send. Keep the durable uncertain marker for conservative readback.\n        check_admission()\n\n    try:\n        response = api.blacklist(ip, decision_deadline(decision), tags, label=label,\n                                 before_send=mark_attempt)\n    except ApiError as error:\n        if decision[\'status\'] == \'prepared\' and error.code == \'decision_expired\':\n            decision[\'status\'] = \'expired_unsent\'\n            state.save_decision(ip, decision)\n            state.finish(ip)\n            log(\'blacklist_skipped\', ip=ip, decision_id=decision[\'id\'], reason=\'duration_below_minimum\')\n            return\n        raise\n    decision[\'write_result\'] = response\n    state.save_decision(ip, decision)\n    if response.get(\'updated\') == 1:\n        log(\'blacklist_conflict\', ip=ip, decision_id=decision[\'id\'], reason=\'concurrent_entry_updated\')\n        decision[\'confirmation_logged\'] = True\n        state.save_decision(ip, decision)\n    refresh_policy(state, api, snapshot)\n    resolve_write(settings, state, ip, decision, snapshot, api.clock())\n\n\ndef process_pending(settings, state, api, snapshot, now):\n    ips = state.pending(100)\n    ready, misses = {}, []\n    for ip in ips:\n        previous = state.decision(ip)\n        if previous and previous.get(\'status\') in (\'intent\', \'uncertain\'):\n            resolve_write(settings, state, ip, previous, snapshot, now)\n            continue\n        white = snapshot[\'whitelist\'].get(ip)\n        if white and active(white, now):\n            log(\'decision_skipped\', ip=ip, reason=\'whitelisted\')\n            state.finish(ip)\n            continue\n        listed = snapshot[\'blacklist\'].get(ip)\n        if listed and active(listed, now):\n            recover_existing(settings, state, ip, snapshot, now)\n            log(\'decision_skipped\', ip=ip, reason=\'already_blacklisted\')\n            continue\n        events = state.events(ip, now - settings.max_age, now)\n        if not events:\n            state.finish(ip)\n            continue\n        # Evidence windows are based on request event time, not five-minute S3\n        # delivery time. Its latest event must still be within the freshness cap.\n        evidence_now = max(event[\'timestamp\'] for event in events)\n        events = [event for event in events if event[\'timestamp\'] >= evidence_now - settings.window]\n        selected = sum(bool(event.get(\'selected_match\')) for event in events)\n        if not selected:\n            detail = evidence(events, now=evidence_now, window_seconds=settings.window)\n            if detail.get(\'behavioral_pattern\'):\n                log(\'behavior_observation\', ip=ip, evidence=report_evidence(detail))\n            state.finish(ip)\n            continue\n        # WafOnly uses fresh customer policy below and never reads/writes ACE cache.\n        cached = (({\'customer\': {}}, None) if settings.detection_policy == \'WafOnly\'\n                  else state.cache_get(ip, now))\n        ready[ip] = (events, evidence_now, cached)\n        if cached is None:\n            misses.append(ip)\n    # Single-IP on Professional. Business/Enterprise combine only cache misses.\n    batch_size = 100 if settings.plan != \'Professional\' else 1\n    for offset in range(0, len(misses), batch_size):\n        group = misses[offset:offset + batch_size]\n        try:\n            verdicts = api.lookup(group, bulk=settings.plan != \'Professional\')\n            fetched_at = int(api.clock())\n            for ip, verdict in verdicts.items():\n                ttl = verdict.get(\'recommendation\', {}).get(\'cache_ttl_seconds\')\n                if isinstance(ttl, bool) or not isinstance(ttl, int) or ttl <= 0:\n                    log(\'lookup_unavailable\', ip=ip, reason=\'invalid_ace_cache_ttl\')\n                    continue\n                state.cache_put(ip, verdict, fetched_at, settings.cache_override or ttl)\n                events, event_now, _ = ready[ip]\n                ready[ip] = (events, event_now, (verdict, fetched_at))\n        except ApiError as error:\n            log(\'lookup_deferred\', ip_count=len(group), reason=error.code, http_status=error.status)\n            for ip in group:\n                state.defer(ip, min(error.retry_after, 3600))\n            if error.status == 429 or error.code in (\'daily_lookup_budget_exhausted\', \'api_backoff\'):\n                break\n        except TimeBudget:\n            break\n    for ip, (events, event_now, cached) in ready.items():\n        api.check_time(35)\n        if cached is None:\n            continue\n        verdict, fetched_at = cached\n        current = api.clock()\n        if current - event_now > settings.max_age:\n            state.finish(ip)\n            log(\'decision_skipped\', ip=ip, reason=\'stale_evidence\')\n            continue\n        verdict = overlay_policy(verdict, ip, snapshot, current)\n        result = assess(events, verdict, fetched_at=fetched_at, now=current, evidence_now=event_now,\n                        minimum_events=settings.minimum, window_seconds=settings.window,\n                        cache_override=settings.cache_override,\n                        blacklist_override=settings.blacklist_override,\n                        detection_policy=settings.detection_policy)\n        result[\'evidence\'] = evidence(events, now=event_now, window_seconds=settings.window)\n        log(\'decision\', ip=ip, mode=settings.mode, detection_policy=settings.detection_policy,\n            publish_blacklist=settings.publish, sync_waf=settings.sync,\n            status=result[\'status\'],\n            reason=result[\'reason\'], proposed_ttl_seconds=result.get(\'ttl_seconds\'),\n            evidence=report_evidence(result[\'evidence\']))\n        if result[\'status\'] != \'eligible\':\n            if result[\'status\'] != \'unavailable\':\n                state.finish(ip)\n            continue\n        if settings.mode == \'Observe\' or not settings.publish:\n            state.finish(ip)\n            log(\'blacklist_skipped\', ip=ip,\n                reason=\'observation_mode\' if settings.mode == \'Observe\' else \'publishing_disabled\')\n            continue\n        ace_valid_until = None\n        if settings.detection_policy == \'WafAndAce\':\n            ace_valid_until = fetched_at + (settings.cache_override or\n                                           verdict[\'recommendation\'][\'cache_ttl_seconds\'])\n        try:\n            write_decision(settings, state, api, snapshot, ip, result, events, current,\n                           ace_valid_until=ace_valid_until)\n        except ApiError as error:\n            log(\'blacklist_deferred\', ip=ip, reason=error.code, http_status=error.status)\n            state.defer(ip, min(error.retry_after, 3600))\n\n\ndef reconcile(settings, snapshot, waf, now):\n    if not settings.sync:\n        return\n    addresses = {\'IPV4\': [], \'IPV6\': []}\n    for ip, row in snapshot[\'blacklist\'].items():\n        if not active(row, now):\n            continue\n        white = snapshot[\'whitelist\'].get(ip)\n        if white and active(white, now):\n            continue\n        version = \'IPV6\' if \':\' in ip else \'IPV4\'\n        addresses[version].append(ip + (\'/128\' if version == \'IPV6\' else \'/32\'))\n    for target in settings.ip_sets:\n        values = sorted(addresses[target[\'version\']])\n        if settings.mode == \'Observe\':\n            log(\'waf_sync_observation\', family=target[\'version\'], desired_entries=len(values))\n            continue\n        try:\n            current = waf.get_ip_set(Name=target[\'Name\'], Id=target[\'Id\'], Scope=\'REGIONAL\')\n            if len(values) > 10000:\n                # Preserve the supported, still-active subset and prune expiry\n                # even during overload. Never silently pick arbitrary new IPs.\n                log(\'waf_sync_capacity_exceeded\', family=target[\'version\'], desired_entries=len(values))\n                desired = set(values)\n                values = sorted(value for value in current[\'IPSet\'][\'Addresses\'] if value in desired)\n            if sorted(current[\'IPSet\'][\'Addresses\']) != values:\n                waf.update_ip_set(Name=target[\'Name\'], Id=target[\'Id\'], Scope=\'REGIONAL\',\n                                  Addresses=values, LockToken=current[\'LockToken\'])\n                log(\'waf_ip_set_updated\', family=target[\'version\'], entries=len(values),\n                    note=\'Rule group must be attached; AWS propagation is asynchronous.\')\n        except (ClientError, BotoCoreError) as error:\n            log(\'waf_sync_failed\', family=target[\'version\'],\n                reason=error.response[\'Error\'][\'Code\'] if isinstance(error, ClientError) else type(error).__name__)\n\n\ndef deliver_notifications(settings, state, sns, api):\n    if settings.mode != \'Enforce\' or settings.notification_mode == \'None\':\n        return\n    for row in state.notifications():\n        api.check_time(10)\n        try:\n            sns.publish(TopicArn=settings.topic, Subject=\'WAFGuard: IP blacklisted\', Message=row[\'payload\'])\n        except (ClientError, BotoCoreError, OSError):\n            state.notification_result(row, False)\n            log(\'notification_deferred\', event_id=row[\'SK\'])\n        else:\n            state.notification_result(row, True)\n\n\ndef run(settings, state, api, s3, waf, sns):\n    token = state.lease()\n    if not token:\n        log(\'invocation_skipped\', reason=\'another_invocation_owns_lease\')\n        return\n    try:\n        snapshot = None\n        try:\n            snapshot = api.policy()\n            state.save_snapshot(short_snapshot(snapshot))\n        except (ApiError, TimeBudget) as error:\n            log(\'policy_unavailable\', reason=getattr(error, \'code\', \'time_budget\'),\n                http_status=getattr(error, \'status\', 0))\n        enforcement_snapshot = snapshot if snapshot is not None else state.snapshot()\n        if snapshot is None and enforcement_snapshot is not None:\n            log(\'using_last_confirmed_policy\', policy_saved_at=enforcement_snapshot[\'saved_at\'])\n        # Expiry maintenance has priority over ingestion and lookup work, even\n        # when FraudGuard is unavailable or there are no new log objects.\n        if enforcement_snapshot is not None:\n            reconcile(settings, enforcement_snapshot, waf, api.clock())\n        deliver_notifications(settings, state, sns, api)\n        if snapshot is not None:\n            process_pending(settings, state, api, snapshot, api.clock())\n            try:\n                ingest(settings, state, s3, api, api.clock())\n            except TimeBudget:\n                log(\'ingestion_deferred\', reason=\'time_budget\')\n            process_pending(settings, state, api, snapshot, api.clock())\n            state.save_snapshot(short_snapshot(snapshot))\n        if snapshot is not None:\n            reconcile(settings, snapshot, waf, api.clock())\n        deliver_notifications(settings, state, sns, api)\n    finally:\n        state.release(token)\n\n\ndef handler(event, context):\n    settings = Settings(os.environ)\n    sdk = BotoConfig(connect_timeout=3, read_timeout=10, retries={\'max_attempts\': 2, \'mode\': \'standard\'})\n    session = boto3.session.Session(region_name=settings.region)\n    secret = session.client(\'secretsmanager\', config=sdk).get_secret_value(SecretId=settings.secret_arn)\n    try:\n        credentials = json.loads(secret[\'SecretString\'])\n        username, password = credentials[\'username\'], credentials[\'password\']\n        if not isinstance(username, str) or not username or not isinstance(password, str) or not password:\n            raise ValueError()\n    except (KeyError, TypeError, ValueError):\n        raise ValueError(\'secret_requires_username_and_password\') from None\n    table = session.resource(\'dynamodb\', config=sdk).Table(settings.table)\n    state = State(table, session.client(\'dynamodb\', config=sdk), username)\n    remaining = context.get_remaining_time_in_millis() / 1000 if context else 300\n    api = FraudGuard(username, password, state, rate=settings.rate, daily_budget=settings.daily_budget,\n                     deadline=time.time() + min(280, remaining - 15))\n    try:\n        run(settings, state, api, session.client(\'s3\', config=sdk),\n            session.client(\'wafv2\', config=sdk), session.client(\'sns\', config=sdk))\n    except TimeBudget:\n        log(\'invocation_deferred\', reason=\'time_budget\')\n    except ClientError as error:\n        log(\'aws_error\', code=error.response[\'Error\'][\'Code\'])\n        raise\n    return {\'mode\': settings.mode, \'detection_policy\': settings.detection_policy,\n            \'deployment_id\': settings.deployment}\n')
          handler = runtime.handler
  Schedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Process recent WAF logs and reconcile blacklist expiry every minute.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: WAFGuardWorker
          Arn: !GetAtt Worker.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 60
            MaximumRetryAttempts: 0
  WorkerAsyncInvocations:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Worker
      Qualifier: '$LATEST'
      MaximumEventAgeInSeconds: 60
      MaximumRetryAttempts: 0
  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Worker
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Schedule.Arn
Outputs:
  WorkerFunctionName:
    Value: !Ref Worker
  CloudWatchLogGroup:
    Value: !Ref WorkerLogGroup
  StateTableName:
    Value: !Ref StateTable
    Description: Retained on stack deletion; remove separately when no longer needed.
  WafGuardRuleGroupArn:
    Condition: CreateWafResources
    Value: !GetAtt WafGuardRuleGroup.Arn
    Description: Attach to the configured web ACL using your console or IaC. Use override action None; earlier terminating rules can bypass this group.
  IPv4SetArn:
    Condition: CreateWafResources
    Value: !GetAtt IPv4Set.Arn
  IPv6SetArn:
    Condition: CreateWafResources
    Value: !GetAtt IPv6Set.Arn
  CreatedNotificationTopicArn:
    Condition: CreateNotifications
    Value: !Ref NotificationTopic
